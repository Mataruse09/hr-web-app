<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Company — HRCore ERP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⬡</div>
        <h1 class="login-title">Register Company</h1>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mb-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" class="login-form">
        <h2>Company Info</h2>
        <div class="form-group"><label>Company Name</label><input name="company_name" required></div>
        <div class="form-group"><label>Industry</label><input name="industry"></div>
        <div class="form-group"><label>Email</label><input name="company_email" type="email" required></div>
        <div class="form-group"><label>Phone</label><input name="company_phone"></div>
        <div class="form-group"><label>Website</label><input name="company_website"></div>
        <div class="form-group"><label>Address</label><textarea name="company_address"></textarea></div>

        <h2>Admin User</h2>
        <div class="form-group"><label>Full Name</label><input name="admin_full_name" required></div>
        <div class="form-group"><label>Username</label><input name="admin_username" required></div>
        <div class="form-group"><label>Email</label><input name="admin_email" type="email" required></div>
        <div class="form-group"><label>Password</label><input name="admin_password" type="password" required></div>

        <button class="btn btn-primary btn-full" type="submit">Register Company</button>
      </form>

      <p class="mt-2">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
    </div>
  </div>
</body>
</html>
