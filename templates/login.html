<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — HRCore ERP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⬡</div>
        <h1 class="login-title">HRCore ERP</h1>
        <p class="login-subtitle">Enterprise HR Management Platform</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mb-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
        <div class="form-group">
          <label class="form-label">Company</label>
          <select name="company" class="form-control" required autofocus>
            <option value="">Select company</option>
            {% for comp in companies %}
              <option value="{{ comp.name }}">{{ comp.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter your username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          Sign In
        </button>
      </form>
      <p class="mt-2">New? <a href="{{ url_for('auth.register_company') }}">Register your company</a></p>

      <div class="login-demo">
        <p class="demo-hint">Demo Accounts</p>
        <code>admin / Admin@123</code> &nbsp;·&nbsp;
        <code>hr_manager / HR@123456</code>
      </div>
    </div>
  </div>
</body>
</html>
