{% extends 'auth_base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Reset Password</h2>
    
    {# Alert box for messages #}
    <div class="alert alert-danger" style="background: #fff5f5; border: 1px solid #f5c6cb; border-left: 4px solid #dc3545; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
        <div style="color: #721c24; font-weight: 500;">
            <strong>🔒 Security Notice</strong>
        </div>
        <div style="color: #721c24; margin-top: 0.5rem; font-size: 0.9rem;">
            Enter your new password below. Make sure it's different from your previous password and contains at least 8 characters.
        </div>
    </div>
    
    <form method="post" class="mt-4">
        <div class="form-group">
            <label for="username">Username</label>
            <!-- ✅ FIX: make readonly to prevent tampering -->
            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" readonly required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control password-input" id="new_password" name="new_password" required>
              <button type="button" class="password-toggle" onclick="togglePassword(this)">
                <span class="eye-icon">👁️</span>
              </button>
            </div>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control password-input" id="confirm_password" name="confirm_password" required>
              <button type="button" class="password-toggle" onclick="togglePassword(this)">
                <span class="eye-icon">👁️</span>
              </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
        <a href="{{ url_for('auth.login') }}" class="btn btn-link">Back to login</a>
    </form>
</div>
{% endblock %}
