<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google-site-verification" content="bUOaXdJVqd7ORv5ooeZDfNpK8q1WfMyas7sujEHXbM0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MatinexHR{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/branding/favicon-64x64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/static/img/branding/favicon-128x128.png">
  <link rel="apple-touch-icon" sizes="128x128" href="/static/img/branding/favicon-128x128.png">

  <!-- reuse same CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <style>
    /* ===== Deep Blue Animated Background ===== */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
      background-size: 200% 200%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Glass Card Container ===== */
    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);

      animation: fadeSlide 0.5s ease;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== Flash Messages (clean floating style) ===== */
    .flash-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
    }

    .alert {
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-width: 250px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      animation: fadeSlide 0.3s ease;
    }

    .alert-success { background: #16a34a; }
    .alert-danger  { background: #dc2626; }
    .alert-warning { background: #f59e0b; }
    .alert-info    { background: #2563eb; }

    .alert button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* ===== Mobile tweak ===== */
    @media (max-width: 500px) {
      .auth-container {
        margin: 15px;
        padding: 20px;
        max-width: 100%;
        border-radius: 12px;
      }
    }
    
    /* ===== Enhanced Mobile Responsive ===== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
        background-size: 300% 300%;
      }
      .auth-container {
        padding: 20px 16px;
      }
      .flash-container {
        right: 10px;
        left: 10px;
      }
      .alert {
        min-width: unset;
        width: 100%;
        font-size: 13px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Flash Messages -->
  <div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
          {{ message }}
          <button onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  <!-- Main Auth Card -->
  <main class="auth-container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
