<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="50" fill="rgba(15,23,42,0.9)"/>
  <circle cx="35" cy="25" r="18" fill="#4f46e5"/>
  <text x="35" y="31" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
  <text x="60" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">MatinexHR</text>
  <rect x="650" y="12" width="60" height="26" rx="13" fill="#4f46e5"/>
  <text x="680" y="31" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle">Admin</text>
  <circle cx="740" cy="25" r="12" fill="#06b6d4"/>
  <text x="740" y="29" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">JD</text>
  
  <!-- Sidebar -->
  <rect x="0" y="50" width="180" height="450" fill="rgba(15,23,42,0.95)"/>
  <rect x="20" y="70" width="140" height="36" rx="8" fill="rgba(79,70,229,0.3)"/>
  <text x="90" y="93" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Dashboard</text>
  <rect x="20" y="116" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="139" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Employees</text>
  <rect x="20" y="162" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="185" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Attendance</text>
  <rect x="20" y="208" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="231" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Leave</text>
  <rect x="20" y="254" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="277" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Payroll</text>
  <rect x="20" y="300" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="323" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">AI Analytics</text>
  <rect x="20" y="346" width="140" height="36" rx="8" fill="transparent"/>
  <text x="90" y="369" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Reports</text>
  
  <!-- Main Content Area -->
  <rect x="200" y="70" width="280" height="120" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="220" y="95" font-family="Arial" font-size="12" fill="#64748b">Total Employees</text>
  <text x="220" y="130" font-family="Arial" font-size="32" font-weight="bold" fill="#1e293b">248</text>
  <text x="220" y="155" font-family="Arial" font-size="11" fill="#22c55e">+12 this month</text>
  <circle cx="440" cy="130" r="25" fill="#4f46e5" opacity="0.2"/>
  <text x="440" y="137" font-family="Arial" font-size="24" fill="#4f46e5" text-anchor="middle">👥</text>
  
  <rect x="500" y="70" width="280" height="120" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="520" y="95" font-family="Arial" font-size="12" fill="#64748b">Present Today</text>
  <text x="520" y="130" font-family="Arial" font-size="32" font-weight="bold" fill="#1e293b">196</text>
  <text x="520" y="155" font-family="Arial" font-size="11" fill="#64748b">79% attendance</text>
  <circle cx="740" cy="130" r="25" fill="#06b6d4" opacity="0.2"/>
  <text x="740" y="137" font-family="Arial" font-size="24" fill="#06b6d4" text-anchor="middle">⏰</text>
  
  <rect x="200" y="210" width="280" height="120" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="220" y="235" font-family="Arial" font-size="12" fill="#64748b">Pending Leave</text>
  <text x="220" y="270" font-family="Arial" font-size="32" font-weight="bold" fill="#1e293b">18</text>
  <text x="220" y="295" font-family="Arial" font-size="11" fill="#f59e0b">5 urgent</text>
  <circle cx="440" cy="270" r="25" fill="#f59e0b" opacity="0.2"/>
  <text x="440" y="277" font-family="Arial" font-size="24" fill="#f59e0b" text-anchor="middle">🏖️</text>
  
  <rect x="500" y="210" width="280" height="120" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="520" y="235" font-family="Arial" font-size="12" fill="#64748b">Payroll This Month</text>
  <text x="520" y="270" font-family="Arial" font-size="32" font-weight="bold" fill="#1e293b">$45,780</text>
  <text x="520" y="295" font-family="Arial" font-size="11" fill="#22c55e">Processed</text>
  <circle cx="740" cy="270" r="25" fill="#7c3aed" opacity="0.2"/>
  <text x="740" y="277" font-family="Arial" font-size="24" fill="#7c3aed" text-anchor="middle">💰</text>
  
  <!-- Chart Area -->
  <rect x="200" y="350" width="380" height="130" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="220" y="375" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Attendance Overview</text>
  <rect x="220" y="390" width="340" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="220" y="390" width="240" height="8" rx="4" fill="#4f46e5"/>
  <rect x="220" y="410" width="340" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="220" y="410" width="280" height="8" rx="4" fill="#06b6d4"/>
  <rect x="220" y="430" width="340" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="220" y="430" width="200" height="8" rx="4" fill="#7c3aed"/>
  <text x="580" y="375" font-family="Arial" font-size="11" fill="#64748b">This Week</text>
  
  <!-- AI Insights Panel -->
  <rect x="600" y="350" width="180" height="130" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <text x="620" y="375" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">AI Insights</text>
  <circle cx="640" cy="410" r="20" fill="#8b5cf6" opacity="0.2"/>
  <text x="640" y="416" font-family="Arial" font-size="20" fill="#8b5cf6" text-anchor="middle">🤖</text>
  <text x="620" y="445" font-family="Arial" font-size="11" fill="#64748b">Attrition Risk</text>
  <text x="620" y="462" font-family="Arial" font-size="14" font-weight="bold" fill="#ef4444">12%</text>
  <text x="700" y="462" font-family="Arial" font-size="10" fill="#64748b">High</text>
</svg>