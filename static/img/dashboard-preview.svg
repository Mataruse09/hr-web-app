<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Dashboard Card 1 - Stats -->
  <rect x="40" y="40" width="200" height="120" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="55" y="60" width="60" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="80" width="100" height="24" rx="4" fill="#4f46e5"/>
  <rect x="55" y="115" width="80" height="12" rx="4" fill="#e2e8f0"/>
  
  <!-- Dashboard Card 2 - Chart -->
  <rect x="260" y="40" width="240" height="120" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="275" y="60" width="80" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="275" y="80" width="180" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="275" y="95" width="140" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="275" y="110" width="160" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="275" y="125" width="120" height="6" rx="3" fill="#e2e8f0"/>
  
  <!-- Dashboard Card 3 - List -->
  <rect x="520" y="40" width="240" height="120" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="535" y="60" width="60" height="8" rx="4" fill="#e2e8f0"/>
  <circle cx="555" y="90" r="12" fill="#4f46e5"/>
  <rect x="575" y="82" width="80" height="8" rx="4" fill="#e2e8f0"/>
  <circle cx="555" y="120" r="12" fill="#7c3aed"/>
  <rect x="575" y="112" width="60" height="8" rx="4" fill="#e2e8f0"/>
  
  <!-- Main Content Area -->
  <rect x="40" y="180" width="340" height="380" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="60" y="220" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Employee Overview</text>
  <rect x="60" y="240" width="300" height="2" fill="#e2e8f0"/>
  
  <!-- Table Header -->
  <rect x="60" y="260" width="300" height="30" rx="4" fill="#f1f5f9"/>
  <text x="75" y="280" font-family="Arial" font-size="11" fill="#64748b">Name</text>
  <text x="180" y="280" font-family="Arial" font-size="11" fill="#64748b">Department</text>
  <text x="280" y="280" font-family="Arial" font-size="11" fill="#64748b">Status</text>
  
  <!-- Table Row 1 -->
  <circle cx="85" cy="310" r="12" fill="#4f46e5"/>
  <text x="110" y="314" font-family="Arial" font-size="12" fill="#1e293b">John Smith</text>
  <text x="180" y="314" font-family="Arial" font-size="12" fill="#64748b">Engineering</text>
  <rect x="280" y="302" width="50" height="16" rx="8" fill="#22c55e"/>
  <text x="305" y="313" font-family="Arial" font-size="9" fill="#ffffff">Active</text>
  
  <!-- Table Row 2 -->
  <circle cx="85" cy="345" r="12" fill="#7c3aed"/>
  <text x="110" y="349" font-family="Arial" font-size="12" fill="#1e293b">Sarah Johnson</text>
  <text x="180" y="349" font-family="Arial" font-size="12" fill="#64748b">Marketing</text>
  <rect x="280" y="337" width="50" height="16" rx="8" fill="#22c55e"/>
  <text x="305" y="348" font-family="Arial" font-size="9" fill="#ffffff">Active</text>
  
  <!-- Table Row 3 -->
  <circle cx="85" cy="380" r="12" fill="#06b6d4"/>
  <text x="110" y="384" font-family="Arial" font-size="12" fill="#1e293b">Mike Davis</text>
  <text x="180" y="384" font-family="Arial" font-size="12" fill="#64748b">Sales</text>
  <rect x="280" y="372" width="50" height="16" rx="8" fill="#22c55e"/>
  <text x="305" y="383" font-family="Arial" font-size="9" fill="#ffffff">Active</text>
  
  <!-- Table Row 4 -->
  <circle cx="85" cy="415" r="12" fill="#f59e0b"/>
  <text x="110" y="419" font-family="Arial" font-size="12" fill="#1e293b">Emily Brown</text>
  <text x="180" y="419" font-family="Arial" font-size="12" fill="#64748b">HR</text>
  <rect x="280" y="407" width="50" height="16" rx="8" fill="#eab308"/>
  <text x="305" y="418" font-family="Arial" font-size="9" fill="#ffffff">On Leave</text>
  
  <!-- Side Panel -->
  <rect x="400" y="180" width="360" height="180" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="420" y="220" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Quick Actions</text>
  <rect x="420" y="240" width="140" height="40" rx="6" fill="#4f46e5"/>
  <text x="490" y="265" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">+ Add Employee</text>
  <rect x="580" y="240" width="140" height="40" rx="6" fill="#7c3aed"/>
  <text x="650" y="265" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">View Reports</text>
  <rect x="420" y="290" width="140" height="40" rx="6" fill="#06b6d4"/>
  <text x="490" y="315" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Attendance</text>
  <rect x="580" y="290" width="140" height="40" rx="6" fill="#f59e0b"/>
  <text x="650" y="315" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Leave Requests</text>
  
  <!-- Bottom Stats -->
  <rect x="400" y="380" width="170" height="180" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="485" y="410" font-family="Arial" font-size="14" fill="#64748b" text-anchor="middle">Total Employees</text>
  <text x="485" y="450" font-family="Arial" font-size="32" font-weight="bold" fill="#4f46e5" text-anchor="middle">248</text>
  <text x="485" y="480" font-family="Arial" font-size="12" fill="#22c55e" text-anchor="middle">+12 this month</text>
  
  <rect x="590" y="380" width="170" height="180" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="675" y="410" font-family="Arial" font-size="14" fill="#64748b" text-anchor="middle">Present Today</text>
  <text x="675" y="450" font-family="Arial" font-size="32" font-weight="bold" fill="#7c3aed" text-anchor="middle">196</text>
  <text x="675" y="480" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">79% attendance</text>
  
  <!-- Logo -->
  <circle cx="680" cy="540" r="30" fill="#4f46e5"/>
  <text x="680" y="548" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
</svg>